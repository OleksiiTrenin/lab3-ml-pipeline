name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acc_threshold:
        description: "Поріг accuracy, % (для демонстрації падіння пайплайна вкажіть, напр., 99.9)"
        default: "40"

env:
  IMAGE: kws-api
  # Для CI навчання скорочено: менше епох і не більше 1000 файлів на клас
  EPOCHS: "5"
  MAX_PER_CLASS: "2000"
  ACC_THRESHOLD: ${{ github.event.inputs.acc_threshold || '99' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pip install ruff==0.5.0
          ruff check src/ scripts/

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kws-api:${{ github.sha }}
          build-args: |
            EPOCHS=${{ env.EPOCHS }}
            MAX_PER_CLASS=${{ env.MAX_PER_CLASS }}
            MODEL_VERSION=1.0.0
            GIT_COMMIT=${{ github.sha }}
          # кеш шарів: завантаження датасету й pip install не повторюються між запусками
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name kws -p 8000:8000 kws-api:${{ github.sha }}

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "Сервіс не став healthy" && exit 1

      - name: Smoke test (/model-info, /predict, некоректний файл)
        run: |
          curl -sf http://localhost:8000/model-info | jq .
          docker cp kws:/app/artifacts/samples/yes.wav /tmp/yes.wav
          curl -sf -X POST -F "file=@/tmp/yes.wav" http://localhost:8000/predict | tee /tmp/predict.json | jq .
          jq -e '.label and .confidence and .latency_ms' /tmp/predict.json
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -F "file=@Dockerfile" http://localhost:8000/predict)
          echo "Некоректний файл -> HTTP $CODE"
          test "$CODE" = "400"

      - name: Quality gate - accuracy
        run: |
          ACC=$(curl -sf http://localhost:8000/model-info | jq '.accuracy')
          echo "accuracy=$ACC (поріг $ACC_THRESHOLD)"
          python3 -c "import sys; sys.exit(0 if float('$ACC') >= float('$ACC_THRESHOLD') else 1)"

      - name: Evaluate inside container
        run: docker exec kws python -m src.evaluate --data-root artifacts/testset --split all

      - name: Quality gate - p95 latency
        run: python3 scripts/benchmark.py --url http://localhost:8000 --wav /tmp/yes.wav -n 100 --max-p95-ms 200

      - name: Logs on failure
        if: failure()
        run: docker logs kws

      - name: Cleanup
        if: always()
        run: docker rm -f kws || true
