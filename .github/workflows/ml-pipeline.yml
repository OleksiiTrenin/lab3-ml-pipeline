name: ml-pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Кількість епох навчання"
        default: "10"
      push_image:
        description: "Опублікувати образ у GHCR"
        type: boolean
        default: false

# Новий коміт у тій самій гілці скасовує попередній запуск
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Найменші привілеї: ширші права отримує лише job build-push
permissions:
  contents: read

env:
  # PR: коротке навчання; main: повне; ручний запуск: значення з UI
  EPOCHS: >-
    ${{ inputs.epochs
        || (github.event_name == 'pull_request' && '3' || '10') }}
  # PR: не більше 2000 записів на клас (перевірка працездатності); main і ручний запуск: увесь датасет
  MAX_PER_CLASS: ${{ github.event_name == 'pull_request' && '2000' || '0' }}
  MIN_ACCURACY: ${{ github.event_name == 'pull_request' && '60' || '80' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff==0.5.0 && ruff check src/ scripts/

  train:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build trainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: trainer
          load: true
          tags: kws-trainer:ci
          # шар із датасетом (2.3 ГБ архів) і pip install береться з кешу GHA
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

      - name: Train in container
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/artifacts" kws-trainer:ci \
            --classes yes no up down --epochs "$EPOCHS" --seed 42 \
            --max-per-class "$MAX_PER_CLASS" --version "sha-${GITHUB_SHA::7}" \
            --out /artifacts 2>&1 | tee artifacts/train.log

      - name: Training summary
        if: success()
        run: |
          jq -r '"### Training\n\n| epochs | samples/class | accuracy, % | size, KB |\n| --- | --- | --- | --- |\n| \(.epochs) | \(.max_per_class // "all") | \(.accuracy) | \(.model_size_kb) |"' \
            artifacts/metrics.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - name: Build runtime image
        run: docker build --target runtime --build-arg GIT_COMMIT="$GITHUB_SHA" -t kws-api:ci .

      - name: Start service
        run: |
          docker run -d --name kws -p 8000:8000 kws-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1

      - name: Golden-sample check
        run: |
          pip install requests
          python scripts/verify_model.py --url http://localhost:8000 \
            --expected samples/expected.json --out metrics/verify.json

      - name: Quality gate (accuracy)
        run: |
          curl -sf http://localhost:8000/model-info \
            | jq -e ".accuracy >= $MIN_ACCURACY"

      - name: Latency benchmark
        run: |
          python scripts/benchmark.py --url http://localhost:8000 --wav samples/yes.wav \
            --n 100 --warmup 10 --out metrics/latency.json

      - name: Report
        if: always()
        run: |
          mkdir -p metrics
          docker logs kws > metrics/service.log 2>&1 || true
          python scripts/make_report.py --metrics metrics/ --model artifacts/metrics.json \
            --out metrics/report.md
          cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: metrics/
          retention-days: 14

  build-push:
    needs: verify
    if: github.event_name == 'push' || inputs.push_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kws-api
          # push у main: sha-<commit> і latest. Ручний запуск може навчити іншу модель
          # (інша кількість епох) з того самого коміту, тому він отримує власний тег
          # і не перезаписує ні sha-<commit>, ні latest.
          tags: |
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=dispatch-${{ github.run_number }}-sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Image summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
